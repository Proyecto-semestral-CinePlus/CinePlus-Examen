spring.application.name=suscripcion
server.port=8081

spring.datasource.driver-class-name=org.sqlite.JDBC

spring.datasource.url=jdbc:sqlite:suscripcion.db
spring.datasource.username=
spring.datasource.password=

# si el archivo suscripcion.db no existe, cambiar por update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Obliga a Spring a ejecutar Flyway PRIMERO y a Hibernate a validar DESPUES
spring.jpa.defer-datasource-initialization=true

# Configuracion de Flyway
# si el archivo suscripcion.db no existe, cambiar enabled a false
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# URL para que Flyway se conecte directo al archivo SQLite
spring.flyway.url=jdbc:sqlite:suscripcion.db
spring.flyway.user=
spring.flyway.password=